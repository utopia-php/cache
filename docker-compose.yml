name: cache

services:
  tests:
    container_name: tests
    image: cache-tests:${PHP_VERSION:-8.4}
    build:
      context: .
      dockerfile: Dockerfile.php-${PHP_VERSION:-8.4}
    networks:
      - database
    volumes:
      - ./phpunit.xml:/usr/src/code/phpunit.xml
      - ./src:/usr/src/code/src
      - ./tests:/usr/src/code/tests
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - redis-cluster
      - hazelcast
      - memcached
      - shardA
      - shardB
      - shardC

  redis:
    image: redis:6.0-alpine
    container_name: cache-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - database

  redis-cluster:
    image: grokzen/redis-cluster:7.0.10
    container_name: redis-cluster
    hostname: redis-cluster
    environment:
      - IP=redis-cluster
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7000 cluster info | grep -q cluster_state:ok"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - database

  hazelcast:
    image: hazelcast/hazelcast:5.3.7
    environment:
      HZ_NETWORK_MEMCACHEPROTOCOL_ENABLED: "true"
    container_name: hazelcast
    networks:
      - database

  memcached:
    image: memcached:1.6.17-alpine
    container_name: memcached
    networks:
      - database

  shardA:
    image: redis:6.0-alpine
    container_name: shardA
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - database

  shardB:
    image: redis:6.0-alpine
    container_name: shardB
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - database

  shardC:
    image: redis:6.0-alpine
    container_name: shardC
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - database

networks:
  database:
